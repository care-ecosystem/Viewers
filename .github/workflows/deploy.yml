name: Deploy OHIF Viewer

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: yarn install --frozen-lockfile

      - run: |
          export NODE_OPTIONS="--max_old_space_size=8192"
          export PUBLIC_URL="/Viewers/"
          yarn build

      - name: Verify build output
        run: |
          ls -la platform/app
          ls -la platform/app/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
