name: Deploy OHIF Docs

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: yarn install

      - run: |
          cd platform/docs
          yarn install
          yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/docs/build

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
