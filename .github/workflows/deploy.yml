name: Deploy OHIF Viewer
on:
  push:
    branches:
      - master
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: yarn install --frozen-lockfile
      - run: |
          export NODE_OPTIONS="--max_old_space_size=8192"
          export PUBLIC_URL="/Viewers/"
          yarn build
      - name: Verify build output
        run: |
          ls -la platform/app
          ls -la platform/app/dist

      # --- SPA 404 / GitHub Pages deep-link support ---

      - name: Add 404.html for SPA routing
        run: |
          cat > platform/app/dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting…</title>
            <script>
              // Single Page Apps for GitHub Pages
              // https://github.com/rafgraph/spa-github-pages
              var pathSegmentsToKeep = 1; // matches PUBLIC_URL="/Viewers/"

              var l = window.location;
              l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
              );
            </script>
          </head>
          <body>
          </body>
          </html>
          EOF

      - name: Inject SPA redirect-restore script into index.html
        run: |
          python3 - << 'PYEOF'
          import re

          path = "platform/app/dist/index.html"
          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          snippet = """<script>
            // Single Page Apps for GitHub Pages
            // https://github.com/rafgraph/spa-github-pages
            (function (l) {
              if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                  return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(
                  null, null,
                  l.pathname.slice(0, -1) + decoded + l.hash
                );
              }
            }(window.location));
          </script>
          """

          if "spa-github-pages" not in html:
              html = re.sub(r"(<head[^>]*>)", r"\1\n" + snippet, html, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
              print("Injected SPA redirect snippet into index.html")
          else:
              print("Snippet already present, skipping")
          PYEOF

      - name: Verify SPA redirect files
        run: |
          echo "--- 404.html ---"
          test -f platform/app/dist/404.html && echo "OK: 404.html exists"
          echo "--- index.html head ---"
          head -n 20 platform/app/dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
